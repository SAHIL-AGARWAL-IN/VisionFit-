name: Keep Streamlit App Awake

on:
  schedule:
    # Every 4 hours. GitHub may delay scheduled runs, so this keeps well inside
    # Streamlit Community Cloud's inactivity window.
    - cron: '0 */4 * * *'
  # Allows manual triggering from the Actions tab
  workflow_dispatch:

jobs:
  keep-alive:
    name: Visit VisionFit in a headless browser
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright + Chromium
        run: |
          pip install playwright==1.49.1
          python -m playwright install --with-deps chromium

      - name: Open the app (wakes it if asleep)
        run: python scripts/keep_awake.py

      - name: Upload screenshot if the app didn't load
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: keep-awake-failure
          path: keep-awake-failure.png
          if-no-files-found: ignore
