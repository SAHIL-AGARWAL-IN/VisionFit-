[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[theme]
base = "light"
primaryColor = "#FF4F12"
backgroundColor = "#F7F7F4"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F1012"
borderColor = "#E4E4DF"
showWidgetBorder = true
baseRadius = "10px"
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
headingFont = "Archivo:https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,600..900&display=swap"
headingFontWeights = [800, 800, 700, 700, 700, 700]

[server]
maxUploadSize = 200
